<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting…</title>
  <link rel="canonical" href="https://iamjaydesign.com/">
  <script>
    (function () {
      var target = new URL(
        window.location.pathname + window.location.search + window.location.hash,
        "https://iamjaydesign.com"
      );
      window.location.replace(target.href);
    }());
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=https://iamjaydesign.com/">
  </noscript>
</head>
